plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.4'
def os = System.getProperty('os.name').toLowerCase()
def arm = System.getProperty('os.arch') in ['aarch64', 'arm64']
def platforms = ['macos', 'macos-arm64', 'linux', 'linux-arm64', 'windows']
def detected = os.contains('mac') ? (arm ? 'macos-arm64' : 'macos') :
    os.contains('linux') ? (arm ? 'linux-arm64' : 'linux') : os.contains('windows') ? 'windows' : 'unsupported'
def selected = providers.gradleProperty('platform').getOrElse(detected)
if (!(selected in platforms)) throw new GradleException("Unsupported platform: $selected; set -Pplatform=" + platforms)
dependencies {
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-openal', 'lwjgl-opengl'].each { module ->
        implementation "org.lwjgl:$module:$lwjglVersion"
        (providers.gradleProperty('allPlatforms').isPresent() ? platforms : [selected]).each { target ->
            runtimeOnly "org.lwjgl:$module:$lwjglVersion:natives-$target"
        }
    }
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = 'linksawakening.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

run {
    if (os.contains('mac')) jvmArgs '-XstartOnFirstThread'
}

tasks.register('runAudioBrowser', JavaExec) {
    group = 'application'
    description = 'Run the Link Awakening music browser'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'linksawakening.audio.browser.AudioBrowserMain'
}

test {
    // MainOpeningRouteTest reads button replay fixtures outside the Java project.
    inputs.files(fileTree('../tools/opening') { include '*-route.tsv' })
    useJUnitPlatform()
}

// Offline framebuffer capture used by tools/intro/compare.py.
tasks.register('captureIntro', JavaExec) {
    group = 'verification'
    description = 'Capture the production intro framebuffer for emulator comparison'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.render.IntroEmulatorCapture'
    jvmArgs '-Djava.awt.headless=true'
    args providers.gradleProperty('introOutput').getOrElse(layout.buildDirectory.dir('intro-comparison/ours').get().asFile.absolutePath),
        providers.gradleProperty('introFrames').getOrElse('3800')
}

// Original captures and scenario input are generated by tools/menu/compare.py --capture.
tasks.register('captureMenu', JavaExec) {
    group = 'verification'
    description = 'Capture production file-menu states for emulator screenshot comparison'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.render.MenuEmulatorCapture'
    jvmArgs '-Djava.awt.headless=true'
    args layout.buildDirectory.dir('menu-comparison').get().asFile.absolutePath
}

// Reference frames come from tools/house/compare.py --capture.
tasks.register('captureHouse', JavaExec) {
    group = 'verification'
    description = 'Capture the opening Marin/Tarin house scene for emulator comparison'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.render.HouseEmulatorCapture'
    jvmArgs '-Djava.awt.headless=true'
    args layout.buildDirectory.dir('house-comparison').get().asFile.absolutePath
}

// Reference pages are reached through normal input by tools/dialog/compare.py --capture.
tasks.register('captureDialog', JavaExec) {
    group = 'verification'
    description = 'Capture all settled pages of the opening Marin conversation'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.render.DialogEmulatorCapture'
    jvmArgs '-Djava.awt.headless=true'
    args layout.buildDirectory.dir('dialog-comparison').get().asFile.absolutePath,
        providers.gradleProperty('dialogScenario').getOrElse('marin')
}

// Shared normal-button route through the actual Main update/input/render loop.
tasks.register('captureOpeningRoute', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.OpeningRouteCapture'
    jvmArgs '-Djava.awt.headless=true'
    args providers.gradleProperty('openingRoute').getOrElse(file('../tools/opening/house-route.tsv').absolutePath),
        providers.gradleProperty('openingOutput').getOrElse(layout.buildDirectory.dir('opening-route').get().asFile.absolutePath)
}

// Never package user-supplied ROMs or saves.
tasks.named('processResources') { exclude '**/*.gb', '**/*.gbc', '**/*.sav' }
def romFile = file(providers.gradleProperty('la.rom').orElse(providers.environmentVariable('LA_ROM'))
    .getOrElse('src/main/resources/rom/azle.gbc'))
tasks.register('testRomResources', Sync) {
    from(romFile) { rename { 'azle.gbc' } }
    into layout.buildDirectory.dir('test-rom/rom')
}
tasks.withType(Test).configureEach {
    dependsOn 'testRomResources'
    classpath += files(layout.buildDirectory.dir('test-rom'))
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    systemProperty 'la.romFree', name == 'romFreeTest'
}
tasks.register('romFreeTest', Test) {
    description = 'Run only tests independent of the user ROM'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
tasks.register('verifyRom') {
    doLast {
        if (!romFile.isFile()) { logger.lifecycle('No user ROM available; ROM tests will be skipped.'); return }
        def hash = java.security.MessageDigest.getInstance('MD5').digest(romFile.bytes).encodeHex().toString()
        if (hash != '07c211479386825042efb4ad31bb525f')
            logger.warn("ROM MD5 $hash differs from expected English DX v1.0 07c211479386825042efb4ad31bb525f")
        else logger.lifecycle('ROM MD5 matches English DX v1.0')
    }
}
tasks.withType(Test).configureEach { dependsOn 'verifyRom' }
run { classpath += files(romFile.parentFile.parentFile) }
