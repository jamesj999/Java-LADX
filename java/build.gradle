plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.lwjgl:lwjgl:3.3.4"
    implementation "org.lwjgl:lwjgl-glfw:3.3.4"
    implementation "org.lwjgl:lwjgl-openal:3.3.4"
    implementation "org.lwjgl:lwjgl-opengl:3.3.4"
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    
    runtimeOnly "org.lwjgl:lwjgl:3.3.4:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw:3.3.4:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-openal:3.3.4:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl:3.3.4:natives-macos-arm64"
}

application {
    mainClass = 'linksawakening.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

run {
    jvmArgs '-XstartOnFirstThread'
}

tasks.register('runAudioBrowser', JavaExec) {
    group = 'application'
    description = 'Run the Link Awakening music browser'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'linksawakening.audio.browser.AudioBrowserMain'
}

test {
    useJUnitPlatform()
}

// Offline framebuffer capture used by tools/intro/compare.py.
tasks.register('captureIntro', JavaExec) {
    group = 'verification'
    description = 'Capture the production intro framebuffer for emulator comparison'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.render.IntroEmulatorCapture'
    jvmArgs '-Djava.awt.headless=true'
    args providers.gradleProperty('introOutput').getOrElse(layout.buildDirectory.dir('intro-comparison/ours').get().asFile.absolutePath),
        providers.gradleProperty('introFrames').getOrElse('3800')
}

// Reference frames come from tools/house/compare.py --capture.
tasks.register('captureHouse', JavaExec) {
    group = 'verification'
    description = 'Capture the opening Marin/Tarin house scene for emulator comparison'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'linksawakening.render.HouseEmulatorCapture'
    jvmArgs '-Djava.awt.headless=true'
    args layout.buildDirectory.dir('house-comparison').get().asFile.absolutePath
}
