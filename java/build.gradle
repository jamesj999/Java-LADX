plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def isMac = osName.contains('mac')
def platformName = isMac ? 'macos' : osName.startsWith('windows') ? 'windows' : 'linux'
def classifier = "natives-${platformName}"
if (arch in ['aarch64', 'arm64']) {
    classifier += '-arm64'
} else if (arch.startsWith('arm')) {
    classifier += '-arm32'
} else if (platformName == 'windows' && arch in ['x86', 'i386']) {
    classifier += '-x86'
}

dependencies {
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-openal', 'lwjgl-opengl'].each { module ->
        implementation "org.lwjgl:${module}:3.3.4"
        runtimeOnly "org.lwjgl:${module}:3.3.4:${classifier}"
    }
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = 'linksawakening.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

if (isMac) {
    application.applicationDefaultJvmArgs = ['-XstartOnFirstThread']
}

tasks.register('runAudioBrowser', JavaExec) {
    group = 'application'
    description = 'Run the Link Awakening music browser'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'linksawakening.audio.browser.AudioBrowserMain'
}

test {
    useJUnitPlatform()
}
